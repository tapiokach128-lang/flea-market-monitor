<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Market Watch — 新着監視</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14120F;
    --surface: #1E1B17;
    --surface-hover: #262219;
    --border: #322D25;
    --text: #F2EDE4;
    --text-muted: #948C7E;
    --amber: #E8A33D;
    --moss: #7A9B7E;
    --red: #C9634C;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(232,163,61,0.06), transparent),
      var(--bg);
    color:var(--text);
    font-family:'Inter', sans-serif;
    min-height:100vh;
  }
  a{ color:inherit; text-decoration:none; }

  header{
    position:sticky; top:0; z-index:10;
    background:rgba(20,18,15,0.92);
    backdrop-filter: blur(10px);
    border-bottom:1px solid var(--border);
    padding:18px 24px 14px;
  }
  .header-top{
    display:flex; align-items:baseline; justify-content:space-between;
    flex-wrap:wrap; gap:8px 20px;
    max-width:1280px; margin:0 auto;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand .dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--moss);
    box-shadow:0 0 0 0 rgba(122,155,126,0.6);
    animation:pulse 2.4s infinite;
  }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(122,155,126,0.5); }
    70%{ box-shadow:0 0 0 8px rgba(122,155,126,0); }
    100%{ box-shadow:0 0 0 0 rgba(122,155,126,0); }
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; letter-spacing:0.12em; text-transform:uppercase;
    color:var(--text-muted);
  }
  h1{
    font-family:'Space Grotesk', sans-serif;
    font-size:22px; font-weight:600; margin:2px 0 0;
    letter-spacing:-0.01em;
  }
  #last-updated{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px; color:var(--text-muted);
  }

  .controls{
    max-width:1280px; margin:14px auto 0;
    display:flex; gap:10px; flex-wrap:wrap; align-items:center;
  }
  #search{
    flex:1; min-width:180px;
    background:var(--surface); border:1px solid var(--border);
    color:var(--text); padding:9px 14px; border-radius:8px;
    font-family:'Inter', sans-serif; font-size:14px;
    outline:none;
  }
  #search:focus{ border-color:var(--amber); }
  #search::placeholder{ color:var(--text-muted); }

  .chip{
    font-family:'IBM Plex Mono', monospace; font-size:12px;
    padding:7px 13px; border-radius:20px;
    border:1px solid var(--border);
    background:transparent; color:var(--text-muted);
    cursor:pointer; white-space:nowrap;
    transition:border-color .15s, color .15s, background .15s;
  }
  .chip:hover{ color:var(--text); border-color:#4a4336; }
  .chip.active{ background:var(--amber); color:#1a1509; border-color:var(--amber); font-weight:500; }

  main{ max-width:1280px; margin:0 auto; padding:22px 24px 60px; }

  #empty-state{
    text-align:center; padding:80px 20px; color:var(--text-muted);
    font-family:'IBM Plex Mono', monospace; font-size:13px;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(240px, 1fr));
    gap:14px;
  }

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
    display:flex; flex-direction:column;
    transition:transform .15s, border-color .15s, background .15s;
  }
  .card:hover{
    background:var(--surface-hover);
    border-color:#4a4336;
    transform:translateY(-2px);
  }
  .card.is-fresh{ border-color:var(--amber); }

  .thumb{
    aspect-ratio:1/1; width:100%;
    background:#0f0d0b;
    display:flex; align-items:center; justify-content:center;
    position:relative; overflow:hidden;
  }
  .thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .thumb .fallback{
    font-family:'Space Grotesk', sans-serif; font-size:28px; font-weight:600;
    color:var(--border);
  }
  .site-tag{
    position:absolute; top:8px; left:8px;
    font-family:'IBM Plex Mono', monospace; font-size:10px; letter-spacing:.03em;
    background:rgba(20,18,15,0.85); color:var(--text);
    padding:3px 8px; border-radius:5px; border:1px solid var(--border);
  }
  .fresh-badge{
    position:absolute; top:8px; right:8px;
    font-family:'IBM Plex Mono', monospace; font-size:10px; font-weight:500;
    background:var(--amber); color:#1a1509;
    padding:3px 7px; border-radius:5px;
  }

  .card-body{ padding:11px 13px 13px; display:flex; flex-direction:column; gap:6px; flex:1; }
  .title{
    font-size:13px; line-height:1.4; color:var(--text);
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    overflow:hidden;
    min-height:2.6em;
  }
  .meta-row{ display:flex; justify-content:space-between; align-items:center; margin-top:auto; }
  .price{
    font-family:'IBM Plex Mono', monospace; font-size:15px; font-weight:500;
    color:var(--amber);
  }
  .ago{
    font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--text-muted);
  }

  footer{
    max-width:1280px; margin:0 auto; padding:0 24px 40px;
    color:var(--text-muted); font-size:12px; font-family:'IBM Plex Mono', monospace;
  }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div>
      <div class="brand">
        <span class="dot"></span>
        <span class="eyebrow">personal resale radar</span>
      </div>
      <h1>Market Watch</h1>
    </div>
    <div id="last-updated">最終更新を確認中…</div>
  </div>
  <div class="controls">
    <input id="search" type="text" placeholder="キーワードで絞り込み(ブランド名など)" />
    <div id="site-filters" style="display:flex; gap:8px; flex-wrap:wrap;"></div>
  </div>
</header>

<main>
  <div id="empty-state" style="display:none;">
    まだデータがありません。GitHub Actionsの「新着監視」が1回実行されると、ここに一覧が表示されます。
  </div>
  <div class="grid" id="grid"></div>
</main>

<footer>
  Market Watch — 個人利用の新着監視ダッシュボード。データは各サイトの検索結果ページから取得しています。
</footer>

<script>
const state = { items: [], activeSite: 'all', query: '' };

function timeAgo(iso){
  const diffMs = Date.now() - new Date(iso).getTime();
  const min = Math.floor(diffMs / 60000);
  if (min < 1) return 'たった今';
  if (min < 60) return `${min}分前`;
  const hr = Math.floor(min / 60);
  if (hr < 24) return `${hr}時間前`;
  return `${Math.floor(hr / 24)}日前`;
}

function render(){
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty-state');
  const q = state.query.trim().toLowerCase();

  const filtered = state.items.filter(item => {
    if (state.activeSite !== 'all' && item.site !== state.activeSite) return false;
    if (q && !(item.title || '').toLowerCase().includes(q) && !(item.keyword || '').toLowerCase().includes(q)) return false;
    return true;
  });

  if (filtered.length === 0){
    grid.style.display = 'none';
    empty.style.display = 'block';
    empty.textContent = state.items.length === 0
      ? 'まだデータがありません。GitHub Actionsの「新着監視」が1回実行されると、ここに一覧が表示されます。'
      : '条件に一致する商品がありません。';
    return;
  }
  grid.style.display = 'grid';
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(item => {
    const isFresh = (Date.now() - new Date(item.found_at).getTime()) < 30 * 60 * 1000;
    const priceText = item.price ? `¥${item.price.toLocaleString()}` : '価格不明';
    const thumb = item.image
      ? `<img src="${item.image}" alt="" loading="lazy" onerror="this.parentElement.innerHTML='<span class=fallback>${(item.site||'?')[0]}</span>'">`
      : `<span class="fallback">${(item.site || '?')[0]}</span>`;

    return `
      <a class="card ${isFresh ? 'is-fresh' : ''}" href="${item.url}" target="_blank" rel="noopener" data-found="${item.found_at}">
        <div class="thumb">
          ${thumb}
          <span class="site-tag">${item.site || ''}</span>
          ${isFresh ? '<span class="fresh-badge">NEW</span>' : ''}
        </div>
        <div class="card-body">
          <div class="title">${(item.title || '').replace(/</g,'&lt;')}</div>
          <div class="meta-row">
            <span class="price">${priceText}</span>
            <span class="ago" data-ago="${item.found_at}">${timeAgo(item.found_at)}</span>
          </div>
        </div>
      </a>
    `;
  }).join('');
}

function renderFilters(){
  const sites = ['all', ...new Set(state.items.map(i => i.site).filter(Boolean))];
  const wrap = document.getElementById('site-filters');
  wrap.innerHTML = sites.map(s =>
    `<button class="chip ${state.activeSite === s ? 'active' : ''}" data-site="${s}">${s === 'all' ? 'すべて' : s}</button>`
  ).join('');
  wrap.querySelectorAll('.chip').forEach(btn => {
    btn.addEventListener('click', () => {
      state.activeSite = btn.dataset.site;
      renderFilters();
      render();
    });
  });
}

async function load(){
  try{
    const res = await fetch('feed.json?_=' + Date.now());
    const data = await res.json();
    state.items = data.items || [];
    document.getElementById('last-updated').textContent =
      data.generated_at ? `最終更新: ${timeAgo(data.generated_at)}` : '';
  } catch(e){
    document.getElementById('last-updated').textContent = 'feed.json の読み込みに失敗しました';
  }
  renderFilters();
  render();
}

document.getElementById('search').addEventListener('input', (e) => {
  state.query = e.target.value;
  render();
});

// 相対時刻を1分ごとに更新
setInterval(() => {
  document.querySelectorAll('[data-ago]').forEach(el => {
    el.textContent = timeAgo(el.dataset.ago);
  });
  const lu = document.getElementById('last-updated');
  if (lu.dataset.generated) lu.textContent = `最終更新: ${timeAgo(lu.dataset.generated)}`;
}, 60000);

load();
// フィード自体も5分おきに再取得(タブを開きっぱなしでも自動更新)
setInterval(load, 5 * 60000);
</script>

</body>
</html>
