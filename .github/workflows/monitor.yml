name: 新着監視

on:
  schedule:
    # 20分おきに実行(UTC基準。頻度を変えたい場合はここを編集)
    - cron: "*/20 * * * *"
  workflow_dispatch: {}   # 手動実行ボタンも使えるようにする

permissions:
  contents: write

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存パッケージインストール
        run: pip install -r requirements.txt

      - name: Webhook URLをconfig.jsonに反映
        run: |
          python -c "
          import json
          with open('config.json') as f:
              c = json.load(f)
          c['discord_webhook_url'] = '${{ secrets.DISCORD_WEBHOOK_URL }}'
          with open('config.json', 'w') as f:
              json.dump(c, f, ensure_ascii=False, indent=2)
          "

      - name: 監視スクリプト実行
        run: python main.py

      - name: 既読リストをコミット(次回実行時の重複通知を防ぐ)
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add seen_ids.json
          git diff --staged --quiet || git commit -m "update seen_ids"
          git push
